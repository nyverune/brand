<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="banner-bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2A1647" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#181224" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#100D16"/>
    </radialGradient>
    <radialGradient id="banner-accent-glow" cx="640" cy="220" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#FF5CB8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#100D16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="banner-emblem-grad" x1="200" y1="80" x2="350" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FF5CB8"/>
    </linearGradient>
    <linearGradient id="banner-wm-grad" x1="300" y1="300" x2="980" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6F0FC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D9C4FF"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="640" fill="#100D16"/>
  <rect width="1280" height="640" fill="url(#banner-bg-glow)"/>
  <circle cx="640" cy="220" r="320" fill="url(#banner-accent-glow)"/>

  <!-- Subtle Cybernetic Grid Pattern -->
  <g opacity="0.12" stroke="#4C3268" stroke-width="1">
    <path d="M 0 80 H 1280 M 0 160 H 1280 M 0 240 H 1280 M 0 320 H 1280 M 0 400 H 1280 M 0 480 H 1280 M 0 560 H 1280"/>
    <path d="M 160 0 V 640 M 320 0 V 640 M 480 0 V 640 M 640 0 V 640 M 800 0 V 640 M 960 0 V 640 M 1120 0 V 640"/>
  </g>

  <!-- Decorative Outer Border -->
  <rect x="24" y="24" width="1232" height="592" rx="16" stroke="#2E2242" stroke-width="2"/>
  <rect x="28" y="28" width="1224" height="584" rx="12" stroke="#4C3268" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Centered Rune Emblem (exact favicon geometry scaled and positioned at x=576, y=65) -->
  <g transform="translate(576, 65) scale(0.25)">
    <!-- Runic Diamond Emblem -->
    <path d="M 256 80 L 416 256 L 256 432 L 96 256 Z" 
          stroke="url(#banner-emblem-grad)" 
          stroke-width="24" 
          stroke-linejoin="round"/>

    <!-- Center Rune -->
    <path d="M 192 176 L 192 336" 
          stroke="url(#banner-emblem-grad)" 
          stroke-width="28" 
          stroke-linecap="round"/>

    <path d="M 320 176 L 320 336" 
          stroke="url(#banner-emblem-grad)" 
          stroke-width="28" 
          stroke-linecap="round"/>

    <path d="M 192 184 L 320 328" 
          stroke="url(#banner-emblem-grad)" 
          stroke-width="28" 
          stroke-linecap="round"/>

    <!-- Central Diamond Core -->
    <polygon points="256,232 280,256 256,280 232,256" fill="#F6F0FC"/>
  </g>

  <!-- Wordmark "NYVERUNE" (Centered, x=365, y=215) -->
  <g transform="translate(365, 215) scale(0.75)" fill="url(#banner-wm-grad)">
    <path d="M 24 24 H 42 L 72 78 V 24 H 88 V 96 H 70 L 40 42 V 96 H 24 Z"/>
    <path d="M 108 24 H 126 L 140 54 L 154 24 H 172 L 149 68 V 96 H 131 V 68 Z"/>
    <path d="M 192 24 H 210 L 226 78 L 242 24 H 260 L 235 96 H 217 Z"/>
    <path d="M 280 24 H 336 V 40 H 298 V 52 H 330 V 68 H 298 V 80 H 336 V 96 H 280 Z"/>
    <path d="M 356 24 H 398 C 414 24 422 32 422 46 C 422 57 415 64 402 67 L 424 96 H 402 L 382 70 H 374 V 96 H 356 Z M 374 40 V 54 H 396 C 401 54 405 52 405 47 C 405 42 401 40 396 40 Z"/>
    <path d="M 442 24 H 460 V 74 C 460 80 464 82 474 82 C 484 82 488 80 488 74 V 24 H 506 V 74 C 506 90 496 98 474 98 C 452 98 442 90 442 74 Z"/>
    <path d="M 526 24 H 544 L 574 78 V 24 H 590 V 96 H 572 L 542 42 V 96 H 526 Z"/>
    <path d="M 612 24 H 668 V 40 H 630 V 52 H 662 V 68 H 630 V 80 H 668 V 96 H 612 Z"/>
    <polygon points="702,52 712,62 702,72 692,62" fill="#FF5CB8"/>
  </g>

  <!-- Tagline Text -->
  <text x="640" y="350" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#8B8297" letter-spacing="1.5">
    Official brand identity, visual guidelines, logos, and design assets for Nyverune.
  </text>

  <!-- 14 Brand Color Swatches Palette Bar at Bottom -->
  <g transform="translate(180, 420)">
    <!-- 1: background -->
    <rect x="0" y="0" width="58" height="42" rx="6" fill="#100D16" stroke="#4C3268" stroke-width="1"/>
    <text x="29" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#8B8297">bg</text>

    <!-- 2: foreground -->
    <rect x="66" y="0" width="58" height="42" rx="6" fill="#F6F0FC"/>
    <text x="95" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#8B8297">fg</text>

    <!-- 3: surface -->
    <rect x="132" y="0" width="58" height="42" rx="6" fill="#181224" stroke="#4C3268" stroke-width="1"/>
    <text x="161" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#8B8297">surface</text>

    <!-- 4: surface_muted -->
    <rect x="198" y="0" width="58" height="42" rx="6" fill="#21182B" stroke="#4C3268" stroke-width="1"/>
    <text x="227" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#8B8297">s_muted</text>

    <!-- 5: primary -->
    <rect x="264" y="0" width="58" height="42" rx="6" fill="#A855F7"/>
    <text x="293" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#C084FC" font-weight="bold">primary</text>

    <!-- 6: secondary -->
    <rect x="330" y="0" width="58" height="42" rx="6" fill="#FF5CB8"/>
    <text x="359" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#FF5CB8" font-weight="bold">secondary</text>

    <!-- 7: accent -->
    <rect x="396" y="0" width="58" height="42" rx="6" fill="#C084FC"/>
    <text x="425" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#8B8297">accent</text>

    <!-- 8: muted -->
    <rect x="462" y="0" width="58" height="42" rx="6" fill="#8B8297"/>
    <text x="491" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#8B8297">muted</text>

    <!-- 9: selection -->
    <rect x="528" y="0" width="58" height="42" rx="6" fill="#4C3268"/>
    <text x="557" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#8B8297">selection</text>

    <!-- 10: border -->
    <rect x="594" y="0" width="58" height="42" rx="6" fill="#2E2242" stroke="#4C3268" stroke-width="1"/>
    <text x="623" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#8B8297">border</text>

    <!-- 11: error -->
    <rect x="660" y="0" width="58" height="42" rx="6" fill="#FF5C72"/>
    <text x="689" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#FF5C72">error</text>

    <!-- 12: warning -->
    <rect x="726" y="0" width="58" height="42" rx="6" fill="#FFC36B"/>
    <text x="755" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#FFC36B">warning</text>

    <!-- 13: success -->
    <rect x="792" y="0" width="58" height="42" rx="6" fill="#75D6A3"/>
    <text x="821" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#75D6A3">success</text>

    <!-- 14: info -->
    <rect x="858" y="0" width="58" height="42" rx="6" fill="#72B7FF"/>
    <text x="887" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#72B7FF">info</text>
  </g>

  <!-- Bottom Details -->
  <text x="640" y="565" text-anchor="middle" font-family="monospace" font-size="12" fill="#4C3268" letter-spacing="2">
    #100D16 · #F6F0FC · #A855F7 · #FF5CB8 · #C084FC · #4C3268
  </text>
</svg>
