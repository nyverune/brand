<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 28" width="184" height="28" fill="none">
  <defs>
    <linearGradient id="sbadge-rune-grad" x1="6" y1="6" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FF5CB8"/>
    </linearGradient>
    <clipPath id="sbadge-clip">
      <rect width="184" height="28" rx="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#sbadge-clip)">
    <!-- Left Background -->
    <rect x="0" y="0" width="34" height="28" fill="#100D16"/>
    <!-- Right Background -->
    <rect x="34" y="0" width="150" height="28" fill="#FF5CB8"/>

    <!-- Subtle divider -->
    <line x1="34" y1="0" x2="34" y2="28" stroke="#2E2242" stroke-width="1"/>

    <!-- Canonical Emblem -->
    <g transform="translate(9, 6) scale(0.25)">
      <path d="M 32 10 L 52 32 L 32 54 L 12 32 Z" stroke="url(#sbadge-rune-grad)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 24 22 L 24 42" stroke="url(#sbadge-rune-grad)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 40 22 L 40 42" stroke="url(#sbadge-rune-grad)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 24 23 L 40 41" stroke="url(#sbadge-rune-grad)" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Badge Text -->
    <text x="44" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#100D16" letter-spacing="0.3">
      Styled with Nyverune
    </text>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="183" height="27" rx="5.5" stroke="#FF5CB8" stroke-opacity="0.4"/>
</svg>
